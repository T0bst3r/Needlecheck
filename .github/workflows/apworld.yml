name: Publish apworld

on:
  push:
    branches: [main]
    paths:
      - "apworld/**"
      - "src/lib/ap/manifest.ts"
      - "src/lib/ap/pack.ts"
      - "src/lib/ap/zip.ts"
      - "scripts/pack-apworld.mjs"
      - ".github/workflows/apworld.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish needlecheck.apworld
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pack the apworld
        run: node --experimental-strip-types scripts/pack-apworld.mjs dist/needlecheck.apworld

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node --input-type=commonjs -p "JSON.parse(require('fs').readFileSync('apworld/needlecheck/archipelago.json','utf8')).world_version")
          node --input-type=commonjs -e "require('fs').writeFileSync('dist/notes.md', 'Generic Needlecheck world ' + process.argv[1] + '. It contains no albums.\n\nPut needlecheck.apworld in Archipelago custom_worlds, then restart the generator. Replace that file only when this release changes. Keeping two copies makes generation load the world twice.\n\nThe crate is Needlecheck.yaml, which the station downloads on its own. Container manifest version 7, for Archipelago 0.7.0.\n')" "$version"
          if gh release view apworld >/dev/null 2>&1; then
            gh release upload apworld dist/needlecheck.apworld --clobber
            gh release edit apworld --title "Needlecheck apworld ${version}" --notes-file dist/notes.md
          else
            gh release create apworld dist/needlecheck.apworld --title "Needlecheck apworld ${version}" --notes-file dist/notes.md --latest=false
          fi
